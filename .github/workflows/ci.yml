name: Offline test suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: anie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: offline-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository governance checks
        run: python tools/check_repo.py
      - name: Compile Python
        run: python -m compileall -q src tests tools
      - name: Install local package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic replay and consumer verification
        run: |
          python -m anie demo --out ./local-data/ci
          python -m anie verify --dir ./local-data/ci/publication
          python examples/aegis_readonly_consumer.py ./local-data/ci/publication
