name: Offline test suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no runtime dependencies)
        run: python -m pip install -e .
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end demonstration
        run: |
          python -m anie demo --out ./local-data/ci
          python -m anie verify --dir ./local-data/ci/publication
